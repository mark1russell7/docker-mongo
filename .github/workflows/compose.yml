# The Docker test of this repository: each Compose file that composeFile writes starts, and its
# connection string reaches the server (test/docker). The shared CI has no Docker step, so this
# workflow starts it on a runner with Docker.
name: Compose

on:
  push:
    branches: [main]
  pull_request:
  # A person starts a run on a branch with no pull request: gh workflow run compose.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:docker
