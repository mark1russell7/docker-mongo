# The CI of this repository: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template,
# its CI.md). The job runs each standard script that package.json has (format:check, typecheck, lint,
# test, build and lint:ste) on Node.js 26.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@a456a3a088d2bf443f2bce9ac0dc0041e827a1de # main

  # The site of .github/site.json: the build, the site check and the probe, with no deploy (CI.md of the
  # template, "The site config"). The Pages workflow deploys the same site from main.
  site:
    uses: mark1russell7/template/.github/workflows/reusable-pages-check.yml@a456a3a088d2bf443f2bce9ac0dc0041e827a1de # main
    permissions:
      contents: read

  # The summary check of the ruleset of main: each job passed (CI.md of the template, "The check of the
  # ruleset").
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci, site]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@a456a3a088d2bf443f2bce9ac0dc0041e827a1de # main
        with:
          needs: ${{ toJSON(needs) }}
